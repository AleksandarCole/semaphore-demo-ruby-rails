version: v1.0
name: "\U0001F48E Ruby CI Pipeline"
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
  containers:
    - name: main
      image: 'ruby:2.7.3'
    - name: postgres
      image: 'postgres:17'
      env_vars:
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: myapp_test
fail_fast:
  stop:
    when: branch != 'master'
auto_cancel:
  running:
    when: branch != 'master'
  queued:
    when: branch = 'master'
blocks:
  - name: ⚙️ Setup
    dependencies: []
    task:
      jobs:
        - name: bundle
          commands:
            - checkout
            - cache restore
            - bundle install
            - cache store
  - name: "\U0001F9EA Unit tests"
    dependencies:
      - ⚙️ Setup
    task:
      prologue:
        commands:
          - checkout
          - cache restore
          - bundle install
          - cache store
          - 'bundle exec rake db:setup'
      jobs:
        - name: RSpec - model tests
          commands:
            - bundle exec rspec spec/models
        - name: RSpec - controller tests
          commands:
            - bundle exec rspec spec/controllers
      epilogue:
        always:
          commands:
            - "[[ -f junit.xml ]] && test-results publish --name \"\U0001F9EA Unit tests\" junit.xml"
after_pipeline:
  task:
    jobs:
      - name: 'Job #1'
        commands:
          - test-results gen-pipeline-report
