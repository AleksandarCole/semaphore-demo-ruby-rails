version: v1.0
name: "\U0001F48E Ruby CI Pipeline"
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
  containers:
    - name: main
      image: 'ruby:3.4.2'
    - name: postgres
      image: 'postgres:17'
      env_vars:
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: myapp_test
fail_fast:
  stop:
    when: branch != 'master'
auto_cancel:
  running:
    when: branch != 'master'
  queued:
    when: branch = 'master'
blocks:
  - name: ⚙️ Setup
    dependencies: []
    task:
      jobs:
        - name: bundle
          commands:
            - checkout
            - cache restore
            - bundle install
            - cache store
  - name: "\U0001F50D Code scanning"
    dependencies:
      - ⚙️ Setup
    task:
      jobs:
        - name: check style + security
          commands:
            - checkout
            - cache restore
            - bundle install
            - cache store
            - bundle exec rubocop
            - bundle exec brakeman
  - name: "\U0001F9EA Unit tests"
    dependencies:
      - "\U0001F50D Code scanning"
    task:
      prologue:
        commands:
          - checkout
          - cache restore
          - bundle install
          - cache store
          - 'bundle exec rake db:setup'
      jobs:
        - name: RSpec - model tests
          commands:
            - bundle exec rspec spec/models
        - name: RSpec - controller tests
          commands:
            - bundle exec rspec spec/controllers
      epilogue:
        always:
          commands:
            - "[[ -f junit.xml ]] && test-results publish --name \"\U0001F9EA Unit tests\" junit.xml"
  - name: "\U0001F3D7️ Integration tests"
    dependencies:
      - "\U0001F9EA Unit tests"
    task:
      prologue:
        commands:
          - checkout
          - cache restore
          - bundle install
          - cache store
      jobs:
        - name: RSpec - feature specs
          commands:
            - 'bundle exec rake db:setup'
            - bundle exec rspec spec/features
      epilogue:
        always:
          commands:
            - "[[ -f junit.xml ]] && test-results publish --name \"\U0001F9EA Unit tests\" junit.xml"
